<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARI · Cross-reference review</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Code+Pro:wght@400;500;600&display=swap">
<style>
  /* ARI brand palette (teal #237585 / lime, cool slate neutrals) — replaces the
     blue developer placeholder the matrix page shipped with. */
  :root {
    --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --surface-inverse:#143e47;
    --border:#e2e8f0; --border-strong:#cbd5e1;
    --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
    --primary:#237585; --primary-hover:#1c5e6b; --primary-soft:#ecf6f8; --primary-soft-border:#a8d6dd;
    --ok:#15803d; --ok-soft:#dcfce7; --ok-border:#bbf7d0;
    --bad:#b91c1c; --bad-soft:#fee2e2; --bad-border:#fecaca;
    --warn:#d97706; --warn-deep:#92400e; --warn-soft:#fef3c7; --warn-border:#fcd34d;
    --font-ui:'Source Sans 3',system-ui,-apple-system,sans-serif;
    --font-display:'Source Serif 4',Georgia,serif;
    --font-mono:'Source Code Pro',ui-monospace,Menlo,monospace;
    --focus:0 0 0 3px color-mix(in srgb,#2e8c9e 30%,transparent);
  }
  html[data-theme="dark"] {
    --bg:#0f172a; --surface:#1e293b; --surface-2:#182436; --surface-inverse:#0b1418;
    --border:#334155; --border-strong:#475569;
    --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
    --primary:#4aa0af; --primary-hover:#7cbfca; --primary-soft:#184c57; --primary-soft-border:#237585;
    --ok:#4ade80; --ok-soft:#14532d; --ok-border:#166534;
    --bad:#f87171; --bad-soft:#4c1d1d; --bad-border:#7f1d1d;
    --warn:#fbbf24; --warn-deep:#fcd34d; --warn-soft:#432d0a; --warn-border:#78350f;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 var(--font-ui); color:var(--text); background:var(--bg);
    height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  h1,h2,h3 { margin:0; }
  button, input, select, textarea { font:inherit; color:inherit; }
  a { color:var(--primary); }
  a:hover { color:var(--primary-hover); }
  .mono { font-family:var(--font-mono); }
  .muted { color:var(--text-2); }
  .dim { color:var(--text-3); }
  .eyebrow { font-size:9.5px; font-weight:700; letter-spacing:.09em; color:var(--text-3); text-transform:uppercase; }
  .spacer { flex:1; }
  .hk { font-family:var(--font-mono); font-size:10px; opacity:.75; }

  /* ---------------------------------------------------------------- buttons */
  .btn { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px;
    border:1px solid var(--border-strong); border-radius:8px; background:var(--surface);
    color:var(--text); font-size:12.5px; cursor:pointer; text-decoration:none;
    transition:background .12s, border-color .12s, color .12s; white-space:nowrap; }
  .btn:hover { border-color:var(--text-3); }
  .btn:focus-visible { outline:none; box-shadow:var(--focus); }
  .btn.sm { height:26px; padding:0 9px; font-size:12px; border-radius:7px; }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
  .btn.primary:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
  .btn.dark { background:var(--surface-inverse); border-color:var(--surface-inverse); color:#fff; font-weight:600; }
  .btn.ok { color:var(--ok); font-weight:600; }
  .btn.ok.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn.bad { color:var(--bad); font-weight:600; }
  .btn.bad.on { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn.big { height:38px; border-radius:9px; font-size:13px; font-weight:700; flex:1; justify-content:center; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.icon { width:28px; padding:0; justify-content:center; }
  .link { color:var(--primary); font-size:11.5px; font-weight:600; cursor:pointer; background:none;
    border:0; padding:0; text-decoration:none; }
  .link:hover { text-decoration:underline; }
  .link.quiet { color:var(--text-2); font-weight:400; }

  /* ---------------------------------------------------------------- header */
  header { display:flex; align-items:center; gap:13px; padding:0 14px; height:52px;
    background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
  .brand { display:flex; align-items:baseline; gap:7px; flex-shrink:0; }
  .brand b { font-family:var(--font-display); font-weight:600; font-size:18px; letter-spacing:-.01em; }
  .brand span { font-size:13px; color:var(--primary); font-weight:600; }
  .vr { width:1px; height:22px; background:var(--border); flex-shrink:0; }
  .avatar { width:21px; height:21px; border-radius:50%; background:var(--surface-inverse); color:#fff;
    font-size:9px; font-weight:700; display:grid; place-items:center; flex-shrink:0; }
  #progress-wrap { flex:1; display:flex; align-items:center; gap:10px; max-width:460px; min-width:150px; }
  .bar { flex:1; height:8px; border-radius:99px; background:var(--border); overflow:hidden; display:flex; }
  .bar i { display:block; transition:width .25s cubic-bezier(.4,0,.2,1); }
  .bar i.ok { background:var(--ok); } .bar i.bad { background:var(--bad); } .bar i.warn { background:var(--warn); }
  #progress-text { font-family:var(--font-mono); font-size:11.5px; color:var(--text-2); white-space:nowrap; }
  #progress-text b { color:var(--text); font-weight:600; }
  #progress-text .left { color:var(--warn); font-weight:600; }

  /* ------------------------------------------------------------ filter bar */
  .filters { display:flex; align-items:center; gap:8px; padding:0 14px; height:42px;
    background:var(--surface-2); border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; }
  .search { display:flex; align-items:center; gap:6px; height:28px; padding:0 9px; flex-shrink:0;
    border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); width:210px; }
  .search input { border:0; background:none; outline:none; width:100%; font-size:12.5px; }
  .chip { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; flex-shrink:0;
    border:1px solid var(--border-strong); border-radius:99px; background:var(--surface);
    color:var(--text-2); font-size:12px; font-weight:500; cursor:pointer; transition:background .12s; }
  .chip:hover { border-color:var(--text-3); }
  .chip .n { font-family:var(--font-mono); font-size:10.5px; }
  .chip.on { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }
  .chip.on .n { opacity:.85; }
  select.mini { height:28px; padding:0 7px; border:1px solid var(--border-strong); border-radius:8px;
    background:var(--surface); font-size:12.5px; cursor:pointer; }
  .keys { display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-3); flex-shrink:0; }
  .keys kbd { font-family:var(--font-mono); border:1px solid var(--border-strong); border-radius:4px;
    padding:1px 5px; background:var(--surface); color:var(--text-2); font-size:10.5px; }

  /* ---------------------------------------------------------------- layout */
  .body { flex:1; display:flex; min-height:0; position:relative; }

  /* ----------------------------------------------------------------- queue */
  #queue { width:274px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; }
  .q-head, .q-foot { display:flex; align-items:center; gap:8px; padding:8px 12px; flex-shrink:0; }
  .q-head { border-bottom:1px solid var(--border); }
  .q-foot { border-top:1px solid var(--border); }
  #q-list { flex:1; overflow-y:auto; }
  .q-row { display:flex; flex-direction:column; gap:5px; padding:8px 12px 9px 9px; cursor:pointer;
    border-bottom:1px solid var(--surface-2); border-left:3px solid transparent; }
  .q-row:hover { background:var(--surface-2); }
  .q-row.active { background:var(--primary-soft); border-left-color:var(--primary); }
  .q-row.active .q-name { font-weight:700; }
  .q-row.done { opacity:.6; }
  .q-top { display:flex; align-items:baseline; gap:6px; }
  .q-name { font-weight:600; font-size:12.5px; flex:1; text-wrap:pretty; }
  .q-ari { font-family:var(--font-mono); font-size:10px; color:var(--text-3); flex-shrink:0; }
  .q-cov { display:flex; gap:2px; align-items:center; }
  .q-cov i { width:13px; height:5px; border-radius:2px; background:var(--border-strong); flex-shrink:0; }
  .q-cov i.s-confirmed, .q-cov i.s-decided { background:var(--ok); }
  .q-cov i.s-flagged { background:var(--bad); }
  .q-cov i.s-predicted { background:var(--warn); }
  /* Part-judged: some ids in the database still have no verdict, so it is not done. */
  .q-cov i.s-partial { background:linear-gradient(90deg,var(--ok) 50%,var(--border-strong) 50%); }
  .q-cov i.s-missing { background:var(--border); border:1px dashed var(--border-strong); }
  .q-left { margin-left:auto; font-size:10.5px; font-weight:600; color:var(--text-2); flex-shrink:0; padding-left:6px; }
  .q-left.hot { color:var(--warn); font-weight:700; }
  .q-left.done { color:var(--ok); }
  .q-check { width:12px; height:12px; color:var(--ok); flex-shrink:0; align-self:center; }

  /* --------------------------------------------------------- disease panel */
  #panel { flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
  .d-head { background:var(--surface); border-bottom:1px solid var(--border);
    padding:11px 18px 12px; display:flex; flex-direction:column; gap:7px; flex-shrink:0; }
  .d-title { display:flex; align-items:center; gap:9px; position:relative; }

  /* "More actions" popover — anchored under its trigger, closed on outside click
     or Escape (see closeMenus() / the document-level listeners in ref-edits.js). */
  .menu-wrap { position:relative; }
  .menu { position:absolute; top:calc(100% + 4px); right:0; min-width:210px; z-index:30;
    background:var(--surface); border:1px solid var(--border-strong); border-radius:10px;
    box-shadow:0 10px 30px rgba(15,23,42,.16); padding:5px; display:none; flex-direction:column; }
  .menu.open { display:flex; }
  .menu button { display:flex; align-items:center; gap:8px; width:100%; padding:7px 9px;
    border:0; background:none; color:var(--text); font-size:12.5px; text-align:left;
    border-radius:7px; cursor:pointer; }
  .menu button:hover, .menu button:focus-visible { background:var(--surface-2); outline:none; }
  .menu button.danger { color:var(--bad); }
  .menu hr { border:0; border-top:1px solid var(--border); margin:4px 2px; }
  .d-accent { width:3px; height:23px; border-radius:2px; background:var(--primary); flex-shrink:0; }
  .d-title h2 { font-family:var(--font-display); font-size:21px; font-weight:600; letter-spacing:-.01em; }
  .code { font-family:var(--font-mono); font-size:11px; color:var(--text-2); background:var(--surface-2);
    border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
  .syns { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .syn { font-size:11.5px; color:var(--text-2); background:var(--surface-2); border:1px solid var(--border);
    border-radius:99px; padding:1px 9px; }
  .d-def { margin:0; font-size:12px; line-height:1.5; color:var(--text-2); max-width:100ch; text-wrap:pretty; }
  #db-list { flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
  .d-foot { height:46px; flex-shrink:0; display:flex; align-items:center; gap:9px; padding:0 18px;
    background:var(--surface); border-top:1px solid var(--border); }

  /* ------------------------------------------------------------- db rows */
  .db { display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:12px; align-items:center;
    background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border-strong);
    border-radius:9px; padding:7px 11px 7px 9px; transition:box-shadow .12s, border-color .12s; }
  .db-key { font-size:10px; font-weight:700; letter-spacing:.07em; color:var(--text-2); }
  .db-body { display:flex; align-items:center; gap:9px; min-width:0; flex-wrap:wrap; }
  .db-acts { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .db.current { border-color:var(--primary); border-left-color:var(--primary); box-shadow:var(--focus); }
  .db.current .db-key { color:var(--primary); }
  .db.s-confirmed, .db.s-decided-ok { border-left-color:var(--ok); }
  .db.s-flagged, .db.s-decided-bad { border-left-color:var(--bad); }
  .db.s-partial { border-left-color:var(--primary); }
  .db.s-predicted { background:color-mix(in srgb,var(--warn-soft) 22%,var(--surface));
    border-style:dashed; border-color:var(--warn); border-left-color:var(--warn); }
  .db.s-missing { background:var(--surface-2); border-style:dashed; }
  .db.s-missing .db-key { color:var(--text-3); }
  .id { display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12px;
    font-weight:600; border-radius:5px; padding:2px 7px; white-space:nowrap; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text); }
  .id:hover { border-color:var(--primary); }
  .id.on { border-color:var(--primary); background:var(--primary-soft); color:var(--primary); }
  .id.v-confirm { background:var(--ok-soft); border-color:var(--ok-border); color:var(--ok); }
  .id.v-reject, .id.v-no_value { background:var(--bad-soft); border-color:var(--bad-border);
    color:var(--bad); text-decoration:line-through; }
  .id.v-skip { opacity:.55; }
  .id.pred { background:var(--warn-soft); border-color:var(--warn-border); color:var(--warn-deep); }
  .id.prior-pos { background:var(--ok-soft); border-color:var(--ok-border); color:var(--ok); }
  .id.prior-neg { background:var(--bad-soft); border-color:var(--bad-border); color:var(--bad); }
  .obj { font-size:12.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; max-width:34ch; }
  .tag { font-size:10.5px; font-weight:600; border-radius:4px; padding:1px 6px; white-space:nowrap; }
  .tag.ok { color:var(--ok); background:var(--ok-soft); }
  .tag.bad { color:var(--bad); background:var(--bad-soft); }
  .tag.warn { color:var(--warn-deep); background:var(--warn-soft); }
  .tag.grey { color:var(--text-3); background:var(--surface-2); border:1px solid var(--border); font-weight:500; }
  .idin { height:26px; width:136px; padding:0 8px; border:1px solid var(--border-strong); border-radius:7px;
    background:var(--surface); font-family:var(--font-mono); font-size:11.5px; outline:none; }
  .idin:focus { border-color:var(--primary); box-shadow:var(--focus); }
  .empty-note { font-size:12px; color:var(--text-3); font-style:italic; }

  /* ------------------------------------------------------------- review pane */
  #divider { width:6px; flex-shrink:0; cursor:col-resize; background:var(--border); touch-action:none; }
  #divider:hover { background:var(--border-strong); }
  #review { width:404px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; }
  body.dragging iframe { pointer-events:none; }
  .r-head { display:flex; align-items:center; gap:8px; padding:9px 13px; border-bottom:1px solid var(--border); flex-shrink:0; }
  /* What the reference indexes hold for the candidate id. Collapsed by default:
     the ARI disease is already spelled out in the panel beside this pane, so the
     height belongs to the source page. Expanding gives synonyms, definition,
     parents and the provenance note. */
  .tgt { border:1px solid var(--border); border-radius:10px; background:var(--surface-2); }
  .tgt.flat { display:flex; align-items:baseline; gap:8px; padding:8px 11px; min-width:0; }
  .tgt > summary { list-style:none; cursor:pointer; padding:8px 11px; display:flex;
    align-items:baseline; gap:8px; min-width:0; border-radius:9px; }
  .tgt > summary::-webkit-details-marker { display:none; }
  .tgt > summary::before { content:'▸'; color:var(--text-3); font-size:10px; flex-shrink:0; }
  .tgt[open] > summary::before { content:'▾'; }
  .tgt > summary:hover { background:var(--surface); }
  .tgt > summary:focus-visible { outline:none; box-shadow:var(--focus); }
  .eyebrow.via { color:var(--warn-deep); }
  .t-label { font-family:var(--font-display); font-size:14.5px; font-weight:600; line-height:1.25;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-label.dim { font-family:var(--font-ui); font-size:12.5px; font-weight:400; }
  .tgt-body { padding:0 11px 10px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .hit { background:var(--ok-soft); border-radius:3px; box-shadow:0 0 0 3px var(--ok-soft); }
  .list { font-size:11.5px; color:var(--text-2); line-height:1.45; }
  .r-verdict { display:flex; gap:7px; padding:0 13px 11px; flex-shrink:0; }
  .r-alt { display:flex; align-items:center; gap:10px; padding:0 13px 10px; flex-shrink:0; }
  .frame { flex:1; min-height:0; border-top:1px solid var(--border); background:var(--surface-2);
    display:flex; flex-direction:column; }
  .frame-bar { display:flex; align-items:center; gap:7px; padding:6px 11px; border-bottom:1px solid var(--border);
    background:var(--bg); flex-shrink:0; }
  .frame-bar .dot { width:7px; height:7px; border-radius:50%; background:var(--border-strong); flex-shrink:0; }
  .frame-bar .url { font-family:var(--font-mono); font-size:10.5px; color:var(--text-2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #r-frame { flex:1; width:100%; border:0; background:#fff; }
  .noframe { flex:1; padding:14px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; background:var(--surface); }
  .r-empty { flex:1; display:grid; place-items:center; padding:30px; text-align:center; color:var(--text-3); font-size:12.5px; }

  /* ------------------------------------------------------------- overlays */
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(4px);
    z-index:40; display:none; align-items:center; justify-content:center; padding:32px; }
  .scrim.open { display:flex; }
  .modal { background:var(--surface); border-radius:16px; box-shadow:0 24px 60px rgba(15,23,42,.28);
    width:100%; max-width:620px; max-height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .modal.wide { max-width:820px; }
  .m-head { display:flex; align-items:center; gap:9px; padding:13px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .m-head h3 { font-family:var(--font-display); font-size:17px; font-weight:600; }
  .m-body { padding:16px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:13px; }
  .m-foot { display:flex; align-items:center; gap:8px; padding:12px 16px; border-top:1px solid var(--border); flex-shrink:0; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field > label { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); }
  .field input, .field textarea, .field select { width:100%; padding:7px 9px; border:1px solid var(--border-strong);
    border-radius:8px; background:var(--surface); font-size:13px; outline:none; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--primary); box-shadow:var(--focus); }
  .field textarea { min-height:64px; resize:vertical; }
  .req { color:var(--bad); }
  .pickgrid { display:flex; flex-wrap:wrap; gap:5px; max-height:230px; overflow-y:auto;
    border:1px solid var(--border); border-radius:10px; padding:9px; }
  .pick { display:flex; align-items:center; gap:5px; font-size:12px; padding:3px 9px;
    border:1px solid var(--border-strong); border-radius:99px; cursor:pointer; user-select:none; }
  .pick:hover { border-color:var(--primary); background:var(--primary-soft); }
  .pick input { accent-color:var(--primary); margin:0; }
  .sum-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .sum-card { border:1px solid var(--border); border-radius:12px; padding:11px 12px;
    display:flex; flex-direction:column; gap:3px; }
  .sum-card b { font-family:var(--font-display); font-size:24px; font-weight:600; line-height:1; }
  .sum-card span { font-size:11px; color:var(--text-2); }
  .sum-list { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .sum-row { display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center;
    padding:7px 11px; border-bottom:1px solid var(--surface-2); font-size:12.5px; }
  .sum-row:last-child { border-bottom:0; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--surface-inverse); color:#fff; font-size:12.5px; padding:9px 15px; border-radius:99px;
    box-shadow:0 10px 30px rgba(15,23,42,.3); z-index:60; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; display:flex; align-items:center; gap:10px; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast button { background:none; border:0; color:#9dbb35; font-weight:700; cursor:pointer; font-size:12.5px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>ARI</b><span>Cross-reference review</span></div>
  <div class="vr"></div>
  <button class="btn" id="assignment-btn" title="Change which diseases are in your queue">
    <span class="avatar" id="assignment-avatar">··</span>
    <span style="font-weight:600">My assignment</span>
    <span class="mono dim" id="assignment-count" style="font-size:11px"></span>
  </button>
  <div id="progress-wrap">
    <div class="bar" id="progress-bar"><i class="ok" style="width:0"></i><i class="bad" style="width:0"></i><i class="warn" style="width:0"></i></div>
    <span id="progress-text"></span>
  </div>
  <div class="spacer"></div>
  <span class="mono dim" id="saved" style="font-size:11.5px"></span>
  <span id="auth"></span>
  <button class="btn" id="summary-btn">Session summary</button>
  <a class="btn" id="prlink" target="_blank" rel="noopener" style="display:none"></a>
  <button class="btn primary" id="publish" disabled>Publish review</button>
  <a class="btn" href="../ref-curate/" title="Curate one disease at a time, across all databases">Disease curator</a>
  <a class="btn" href="../">← App</a>
</header>

<div class="filters">
  <div class="search">
    <svg viewBox="0 0 20 20" width="13" height="13" fill="var(--text-3)" aria-hidden="true"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
    <input id="filter" placeholder="Filter my queue…" autocomplete="off">
  </div>
  <div class="vr" style="height:18px"></div>
  <div style="display:flex;gap:6px" id="status-chips"></div>
  <div class="vr" style="height:18px"></div>
  <select class="mini" id="db-filter" title="Show only one database"></select>
  <div class="spacer"></div>
  <div class="keys">
    <kbd>y</kbd> confirm <kbd>n</kbd> reject <kbd>x</kbd> no value <kbd>s</kbd> skip <kbd>j</kbd>/<kbd>k</kbd> move
  </div>
</div>

<div class="body">
  <aside id="queue">
    <div class="q-head">
      <span class="eyebrow">My queue</span>
      <span class="mono muted" id="q-progress" style="font-size:10.5px"></span>
      <div class="spacer"></div>
      <select class="mini" id="q-sort" style="height:24px;font-size:11.5px;border:0;background:none;color:var(--primary);font-weight:600">
        <option value="work">Sort: work left</option>
        <option value="name">Sort: name</option>
        <option value="ari">Sort: ARI id</option>
      </select>
    </div>
    <div id="q-list"><p class="muted" style="padding:14px">Loading your queue…</p></div>
    <div class="q-foot">
      <button class="link" id="assign-more">Add diseases →</button>
      <div class="spacer"></div>
      <button class="link quiet" id="new-subtype">＋ New subtype</button>
    </div>
  </aside>

  <main id="panel">
    <div class="r-empty" id="panel-empty">Pick a disease from your queue to start reviewing.</div>
  </main>

  <div id="divider"></div>
  <aside id="review">
    <div class="r-empty">Select a reference to review it here.</div>
  </aside>
</div>

<div class="scrim" id="assign-scrim"></div>
<div class="scrim" id="summary-scrim"></div>
<div class="scrim" id="subtype-scrim"></div>
<div class="toast" id="toast"><span></span><button>Undo</button></div>

<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
    else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch(e){}
</script>
<script src="ref-edits.js?v=__ASSETV__"></script>
</body>
</html>
