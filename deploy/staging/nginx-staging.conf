# /etc/nginx/sites-available/ari-mm-staging  (symlink into sites-enabled; STAGING.md)
# The staging copy at the root of its own subdomain. A separate host keeps its
# session cookie apart from the live app's: both are named `session`, and on one
# host signing in to staging would sign you out of aurint.ca/ari-editor.
# No prefix to strip, so proxy_pass carries no URI and nginx passes the raw
# request URI through, %2F in disease IRIs included.

# Its own zones: the live file's ari_api/ari_pub are declared there, and sharing
# them would let staging traffic spend the live site's budget.
limit_req_zone $binary_remote_addr zone=ari_stg_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ari_stg_pub:10m rate=6r/m;

server {
    listen 80;
    server_name staging.aurint.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.aurint.ca;

    # The live site's Cloudflare Origin Certificate, which also covers *.aurint.ca.
    ssl_certificate     /etc/ssl/certs/aurint.ca.pem;
    ssl_certificate_key /etc/ssl/private/aurint.ca.key;

    merge_slashes off;
    limit_req_status 429;

    location ~ /\.(git|env) { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    # A test site: keep it out of search results.
    add_header X-Robots-Tag              "noindex, nofollow"                  always;

    location / {
        limit_req zone=ari_stg_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v2/publish {
        limit_req zone=ari_stg_pub burst=3 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        limit_req zone=ari_stg_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }
}
