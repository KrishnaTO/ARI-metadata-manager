<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone start page, search open</title>
<script src="../support.js"></script>
<link rel="stylesheet" href="ds/ari-catalog/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@200;300;400;500;600&display=swap">
<style>
body{margin:0}
a{color:#155160}a:hover{color:#0f2840}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #1f6b7a;outline-offset:2px}
</style>
</helmet>
<div data-theme="light" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5">
  <!-- Tapping “Search diseases” opens the field across the bar and puts the cursor in it. -->
  <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--bar); color: #fff">
    <div style="flex: 1 1 auto; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; background: var(--bg); color: var(--ink); box-shadow: 0 0 0 3px rgba(157,211,214,.55)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" style="flex: none; color: var(--mute)"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input aria-label="Search" placeholder="Diseases, codes or symptoms" style="flex: 1 1 auto; min-width: 0; border: 0; background: none; font-size: 16px; outline: none">
    </div>
    <button style="height: 44px; padding: 0 10px; border: 0; background: none; color: #fff; font-size: 15px">Cancel</button>
  </header>

  <main style="flex: 1 1 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px">
    <div>
      <h1 style="margin: 0; font-weight: 200; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em">Find a disease</h1>
      <p style="margin: 6px 0 0; font-size: 14px; color: var(--mute)">228 diseases. Search by name, synonym, code or symptom.</p>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1 1 0; height: 44px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-050); font-size: 14px; font-weight: 500">Search diseases</button>
      <button style="flex: 1 1 0; height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); font-size: 14px">Open the index</button>
    </div>
    <section aria-labelledby="ps-recent" style="display: flex; flex-direction: column">
      <h2 id="ps-recent" style="margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--mute)">RECENTLY OPENED</h2>
      <a href="Phone.dc.html" style="display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none">Type 1 diabetes mellitus</a>
      <a href="#" style="display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none">Multiple sclerosis</a>
      <a href="#" style="display: flex; align-items: center; min-height: 48px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none">Systemic lupus erythematosus</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
