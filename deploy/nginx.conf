# /etc/nginx/sites-available/ari-mm  (symlink into sites-enabled)
# Cloudflare Full (Strict) SSL setup.
# FastAPI serves at root (/); nginx strips the /ari-editor prefix.

# Extract path after /ari-editor from raw URI to preserve %2F in disease IRIs.
map $request_uri $backend_path {
    ~^/ari-editor(.*) $1;
}

# Rate limiting. The API is unauthenticated in places and /publish fans out to
# eight GitHub calls, so one stuck retry loop can saturate the single uvicorn
# worker. Zones are declared here and applied in the location blocks below.
limit_req_zone $binary_remote_addr zone=ari_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=ari_pub:10m  rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name aurint.ca www.aurint.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aurint.ca www.aurint.ca;

    # Cloudflare Origin Certificate (free, from Cloudflare dashboard)
    # SSL/TLS → Origin Server → Create Certificate
    ssl_certificate     /etc/ssl/certs/aurint.ca.pem;
    ssl_certificate_key /etc/ssl/private/aurint.ca.key;

    # Don't merge slashes — %2F in IRIs looks like a slash to nginx
    merge_slashes off;

    # Security: deny access to dotfiles (.git, .env, etc.)
    location ~ /\.(git|env) { deny all; return 404; }
    location ~ /\.          { deny all; return 404; }

    # Security headers. `always` so they are set on error responses too.
    # HSTS is one year with subdomains; remove `preload` unless the domain is
    # actually submitted to the preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                            always;
    add_header X-Frame-Options           "DENY"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"    always;
    # The Content-Security-Policy is set by the app (app/main.py:security_headers)
    # so it stays next to the markup it constrains and covers non-nginx runs.

    # Strip the /ari-editor prefix preserving %2F in disease IRIs.
    # Using $backend_path (from map on $request_uri) keeps the raw encoded URI.
    location /ari-editor/ {
        limit_req zone=ari_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8001$backend_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /ari-editor;
    }

    # Publishing is expensive and human-paced: a much tighter budget.
    location = /ari-editor/api/v2/publish {
        limit_req zone=ari_pub burst=3 nodelay;
        proxy_pass http://127.0.0.1:8001$backend_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /ari-editor;
        proxy_read_timeout 120s;
    }

    # Health check, unauthenticated and cheap. Reports ontology load state and
    # working-copy count; no curation content.
    location = /ari-editor/healthz {
        access_log off;
        limit_req zone=ari_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8001$backend_path;
        proxy_set_header Host $host;
    }

    # Redirect / to /ari-editor/ (optional convenience)
    location = / {
        return 301 /ari-editor/;
    }
}
