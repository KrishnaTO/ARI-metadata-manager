name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    # Blocking gate: the app must install and its tests must pass. `pytest`
    # subsumes the byte-compile and import-smoke steps this job used to carry:
    # ten test modules import `app.main`, which builds `workspace.BASE` (and so
    # loads the ontology) at import time, and `ruff check .` in the lint job is
    # the parse gate for every file compileall covered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Validate the published mapping set
        # Undeclared CURIE prefixes, doubled prefixes, timestamps with no
        # timezone, and contradictory judgments with nothing marked superseded.
        run: python scripts/validate_mappings.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend tests
        # The review page owns the verdict state machine, the missing-first
        # ordering, the separation-of-duties gate and the publish payload. No
        # framework: the pure functions live in static/ref-edits/review-model.js.
        run: node --test tests/review-model.test.js

  lint:
    # A required gate. It was advisory (--exit-zero) with 184 outstanding
    # findings: at that volume the log was noise, nobody read it, and the count
    # only grew. The 19 auto-fixable ones are fixed, E701/E702 are ignored as
    # deliberate house style, and three table-shaped files have a per-file E501
    # ignore — so the baseline is clean and new code cannot add to a pile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
