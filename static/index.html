<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARI Disease Metadata Manager</title>
<!-- Third-party libs pinned to exact versions with Subresource Integrity (SRI):
     a CDN compromise or a silent upstream change can no longer inject code into an
     authenticated editor's session — the browser refuses any file whose hash differs.
     Bump the version and the matching integrity hash together. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.7/build/d3.layout.cloud.js" integrity="sha384-bI0nd/RAwAtZt0P/RMrpDzJ5neK0yrKvlsnqYvSISaz7sEUWIcNuiTrvs2F9b+mM" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:wght@600;700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=__ASSETV__">
</head>
<body>
<!-- One row, three zones: identity (brand) · scope (what you are looking at:
     search, then the pages and actions that work on a disease) · account and
     the publish action. Set-and-forget options live behind ⚙, not in the bar. -->
<header>
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 00-9 9h18a9 9 0 00-9-9z"/><path d="M12 12v7a2.5 2.5 0 005 0"/></svg></span>
    <span class="brand-name">Autoimmune Registry</span> <span class="brand-sub">Metadata Manager</span>
  </div>
  <span class="tsep"></span>
  <div class="search-wrap">
    <input id="search" placeholder="Search diseases, synonyms, codes…" autocomplete="off">
    <div id="search-results" class="dropdown hidden"></div>
  </div>
  <button id="symptom-search-btn" class="hbtn" title="Search diseases by symptom">&#129657;<span class="lbl">Symptoms</span></button>
  <!-- Relative href: the app is mounted under a path prefix in production. -->
  <a id="matrix-link" class="hbtn" href="ref-edits/" title="Open the cross-reference review matrix">&#9638;<span class="lbl">Review matrix</span></a>
  <span class="spacer"></span>
  <button id="new-disease-btn" class="hbtn primary" title="Create a new disease entry">&#xFF0B; New Disease</button>
  <button id="edit-toggle" class="hbtn" disabled>&#9998; Edit</button>
  <span class="tsep"></span>
  <!-- GitHub identity and publish control (injected by js/github.js). -->
  <span id="gh-slot"></span>
  <div class="menuwrap">
    <button id="settings-btn" class="hbtn icon" aria-expanded="false" aria-label="Settings and preferences" title="Settings and preferences">&#9881;</button>
    <div class="menu" id="app-menu" role="dialog" aria-label="Settings and preferences">
      <div class="menu-h">Appearance</div>
      <div class="menu-row"><span>Theme</span>
        <div class="seg" id="theme-seg"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
      </div>
      <div class="menu-sep"></div>
      <div class="menu-h">Workspace</div>
      <button class="menu-item" id="menu-settings">Data source, identity &amp; export…</button>
      <div id="menu-account"></div>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <div class="left-col">
    <div class="tabs">
      <button class="tab active" data-view="alphabetical">Alphabetical</button>
      <button class="tab" data-view="tissue">Tissue Target</button>
    </div>
    <div class="pane" id="tree-pane"><div class="loading">Loading...</div></div>
  </div>

  <div class="col-resizer" id="resize-left" title="Drag to resize the list"></div>

  <div class="mid-col" id="mid-col">
    <div id="detail-pane">
      <div class="empty-state">
        <p style="font-size:24px;margin:0 0 8px">&#128203;</p>
        <p>Select a disease from the list to view details.</p>
      </div>
    </div>
  </div>

  <div class="col-resizer" id="resize-right" title="Drag to resize the panel"></div>

  <div class="right-col" id="right-col">
    <div class="right-panel" id="right-panel-content"></div>
  </div>
</div>

<footer id="app-footer">
  <div id="onto-meta"></div>
</footer>

<!-- App modules — classic scripts, loaded in dependency order (shared global scope) -->
<script src="js/core.js?v=__ASSETV__"></script>
<script src="js/trees.js?v=__ASSETV__"></script>
<script src="js/detail.js?v=__ASSETV__"></script>
<script src="js/panels.js?v=__ASSETV__"></script>
<script src="js/graph.js?v=__ASSETV__"></script>
<script src="js/editor.js?v=__ASSETV__"></script>
<script src="js/resize.js?v=__ASSETV__"></script>
<script src="js/feedback.js?v=__ASSETV__"></script>
<script src="js/github.js?v=__ASSETV__"></script>
<script src="js/settings.js?v=__ASSETV__"></script>
<script src="js/symptoms.js?v=__ASSETV__"></script>
<script src="js/main.js?v=__ASSETV__"></script>
</body>
</html>
