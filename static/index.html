<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARI Disease Metadata Manager</title>
<!-- Third-party libs pinned to exact versions with Subresource Integrity (SRI):
     a CDN compromise or a silent upstream change can no longer inject code into an
     authenticated editor's session — the browser refuses any file whose hash differs.
     Bump the version and the matching integrity hash together. -->
<!-- Vendored, not loaded from a CDN. SRI pinning is exactly right for integrity,
     but it does nothing for *availability*, and hospital, university and pharma
     networks block third-party CDNs routinely — the failure mode was a broken
     pathophysiology graph with no explanation. See static/vendor/README.md for
     the versions, their upstream URLs, and how to refresh them. -->
<script src="vendor/chart.umd.min.js?v=__ASSETV__"></script>
<script src="vendor/d3.min.js?v=__ASSETV__"></script>
<script src="vendor/d3.layout.cloud.js?v=__ASSETV__"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@200;300;400;500;600;700&family=IBM+Plex+Serif:wght@400&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css?v=__ASSETV__">
<link rel="stylesheet" href="css/ui-dialog.css?v=__ASSETV__">
<!-- Theme and text size, applied before the first paint. -->
<script src="js/boot.js?v=__ASSETV__"></script>
</head>
<body>
<!-- One 56px bar: identity · search · the Read/Curate mode switch · account.
     Everything set-and-forget (new disease, symptom search, review matrix, theme,
     data source) lives behind the preferences button, not in the bar. -->
<header>
  <!-- Pins and unpins the disease index. Above 1200px it docks or collapses the
       rail; below that, where the rail is an overlay, it opens and closes it. -->
  <button id="rail-toggle" class="iconbtn" aria-expanded="true" aria-controls="disease-index"
          aria-label="Hide the disease index" title="Hide the disease index">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <!-- The wordmark is the way back to the start state. -->
  <a class="brand" href="./" title="Back to the start page">
    <span class="brand-name">Autoimmune Registry</span>
    <span class="brand-sub">Metadata Manager</span>
  </a>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="search" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" placeholder="Search diseases, synonyms, codes" autocomplete="off">
    <div id="search-results" class="dropdown hidden"></div>
  </div>
  <!-- Relative href: the app is mounted under a path prefix in production. -->
  <a id="matrix-link" class="hbtn" href="ref-edits/" title="Open the cross-reference review matrix">Cross-references</a>
  <!-- GitHub identity and publish control (injected by js/github.js). -->
  <span id="gh-slot"></span>
  <div class="menuwrap">
    <button id="settings-btn" class="iconbtn" aria-expanded="false" aria-label="Settings and preferences" title="Settings and preferences">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="menu" id="app-menu" role="dialog" aria-label="Settings and preferences">
      <div class="menu-h">Workspace</div>
      <button class="menu-item" id="new-disease-btn">New disease…</button>
      <button class="menu-item" id="symptom-search-btn">Search by symptom…</button>
      <div class="menu-sep"></div>
      <div class="menu-h">Appearance</div>
      <div class="menu-row"><span>Theme</span>
        <div class="seg" id="theme-seg"><button data-theme="light">Light</button><button data-theme="dark">Dark</button></div>
      </div>
      <div class="menu-row"><span>Text size</span>
        <div class="seg" id="textsize-seg" title="Scales the whole app, here and on the cross-reference matrix">
          <button data-textsize="standard">Standard</button><button data-textsize="large">Large</button><button data-textsize="larger">Larger</button></div>
      </div>
      <label class="menu-row check" title="The cloud repeats the symptom list above it at sizes that encode only likelihood">
        <span>Symptom word cloud</span><input type="checkbox" id="pref-wordcloud"></label>
      <div class="menu-sep"></div>
      <div class="menu-h">Data</div>
      <button class="menu-item" id="menu-settings">Data source, identity &amp; export…</button>
      <div id="menu-account"></div>
    </div>
  </div>
</header>

<div class="layout" id="layout">
  <div class="left-col" id="disease-index">
    <div class="tabs">
      <button class="tab active" data-view="alphabetical">A–Z</button>
      <button class="tab" data-view="tissue">Tissue</button>
    </div>
    <div class="pane" id="tree-pane" role="tree" aria-label="Disease index"><div class="loading">Loading...</div></div>
    <div class="rail-legend">
      <span class="rail-legend-key"><span class="ai-dot"></span>Confirmed autoimmune</span>
      <label class="rail-filter" title="Show only diseases confirmed autoimmune">
        <input type="checkbox" id="ai-only"> Show only
      </label>
    </div>
  </div>

  <div class="col-resizer" id="resize-left" title="Drag to resize the list"></div>

  <div class="mid-col" id="mid-col">
    <div id="detail-pane"></div>
  </div>

  <!-- Deep-dive container. It is moved into the reading column of the record on
       each render (see detail.js) so a category opens inline under the story
       spine; below 1024px the same element becomes a drawer over the record.
       #resize-right is retained for the resize module but no longer visible. -->
  <div class="col-resizer" id="resize-right" title="Drag to resize the panel"></div>

  <div class="right-col" id="right-col">
    <div class="right-panel" id="right-panel-content"></div>
  </div>
</div>

<footer id="app-footer">
  <div id="onto-meta"></div>
</footer>

<!-- App modules — classic scripts, loaded in dependency order (shared global scope) -->
<script src="js/ui-dialog.js?v=__ASSETV__"></script>
<script src="js/core.js?v=__ASSETV__"></script>
<script src="js/trees.js?v=__ASSETV__"></script>
<script src="js/detail.js?v=__ASSETV__"></script>
<script src="js/panels.js?v=__ASSETV__"></script>
<script src="js/graph.js?v=__ASSETV__"></script>
<script src="js/editor.js?v=__ASSETV__"></script>
<script src="js/resize.js?v=__ASSETV__"></script>
<script src="js/feedback.js?v=__ASSETV__"></script>
<script src="js/github.js?v=__ASSETV__"></script>
<script src="js/settings.js?v=__ASSETV__"></script>
<script src="js/symptoms.js?v=__ASSETV__"></script>
<script src="js/main.js?v=__ASSETV__"></script>
</body>
</html>
